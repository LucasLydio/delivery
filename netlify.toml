[build]
  command = "npm run build"
  publish = "dist/delivery/browser"
  functions = "netlify/functions"

[build.environment]
  # This committed file contains development examples and documented placeholders.
  # Keep secret scanning enabled for source code, functions, and generated build files.
  SECRETS_SCAN_OMIT_PATHS = ".env.example"
  # These values are public paths, identifiers, numeric settings, or local-only
  # configuration. They are intentionally present in source code and tests.
  SECRETS_SCAN_OMIT_KEYS = "LOCAL_PRODUCT_IMAGE_DIRECTORY,PRODUCT_IMAGE_BASE_URL,STORAGE_PROVIDER,FEE_PER_KM,DEV_API_PORT,AUTH_REFRESH_COOKIE_NAME,MERCADO_PAGO_API_URL,AUTH_TOKEN_AUDIENCE,MERCADO_PAGO_FEE_PERCENT,CHECKOUT_LOCK_TTL_MS"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[dev]
  command = "npm run start"
  targetPort = 4200
  port = 8888
  publish = "dev-static"
  framework = "#custom"

[[redirects]]
  from = "/api/order-events"
  to = "/.netlify/functions/order-events"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
