<div class="admin-shell">
  <header class="admin-header">
    <a class="admin-brand" routerLink="/admin/orders" aria-label="Ir para pedidos">
      <span class="admin-brand__mark" aria-hidden="true">✳</span>
      <span><strong>Gestão da loja</strong><small>Painel operacional</small></span>
    </a>
    <div class="admin-user">
      <span
        ><strong>{{ auth.user()?.name }}</strong
        ><small>{{ auth.user()?.profile === 'ADMIN' ? 'Administrador' : 'Gerente' }}</small></span
      >
      <button type="button" [disabled]="signingOut()" (click)="logout()">
        {{ signingOut() ? 'Saindo…' : 'Sair' }}
      </button>
    </div>
  </header>
  <div class="admin-body">
    <nav class="admin-nav" aria-label="Navegação administrativa">
      <a routerLink="/admin/orders" routerLinkActive="active"
        ><span aria-hidden="true">▤</span> Pedidos</a
      >
      <a routerLink="/admin/products" routerLinkActive="active"
        ><span aria-hidden="true">◆</span> Produtos</a
      >
      <a routerLink="/admin/categories" routerLinkActive="active"
        ><span aria-hidden="true">◇</span> Categorias</a
      >
    </nav>
    <main class="admin-content"><router-outlet /></main>
  </div>
</div>
