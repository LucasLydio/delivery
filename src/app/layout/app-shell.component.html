<div class="app-shell" [class.app-shell--no-nav]="!showNav()">
  @if (showHeader()) {
  <header class="app-header">
    <a class="app-identity" routerLink="/" aria-label="Go to menu">
      <span class="app-identity__mark" aria-hidden="true">✳</span>
      <span class="app-identity__copy">
        <small>Deliver to</small>
        <strong>{{ profile.profile().address }}</strong>
      </span>
      <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m8 10 4 4 4-4" />
      </svg>
    </a>

    <div class="header-actions">
      <app-install-button [compact]="true" />
      <button class="header-action" type="button" aria-label="Notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" />
        </svg>
        <span class="notification-dot" aria-hidden="true"></span>
      </button>
      <a class="header-action" routerLink="/cart" aria-label="Open cart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 7h15l-2 9H8L6 3H3M9 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 21a1 1 0 1 0 0-2 1 1 0 0 0 0 2" />
        </svg>
        @if (cart.count() > 0) {
          <span class="action-badge" [attr.aria-label]="cart.count() + ' items'">{{ cart.count() > 9 ? '9+' : cart.count() }}</span>
        }
      </a>
    </div>
  </header>
  }

  <main class="app-content" id="main-content">
    <router-outlet />
  </main>

  @if (showNav()) {
  <nav class="bottom-navigation" aria-label="App navigation">
    <a class="nav-item" routerLink="/" routerLinkActive="nav-item--active" [routerLinkActiveOptions]="{ exact: true }">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9H5v-9M9 20v-6h6v6" /></svg>
      </span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item" routerLink="/offers" routerLinkActive="nav-item--active">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12 12 20l-9-9V4h7l10 8ZM7.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1Z" /></svg>
      </span>
      <span class="nav-label">Offers</span>
    </a>
    <a class="nav-item" routerLink="/orders" routerLinkActive="nav-item--active">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Zm3 5h6M9 12h6" /></svg>
      </span>
      <span class="nav-label">Orders</span>
    </a>
    <a class="nav-item" routerLink="/cart" routerLinkActive="nav-item--active">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h15l-2 9H8L6 3H3M9 21h.01M18 21h.01" /></svg>
      </span>
      <span class="nav-label">Cart</span>
    </a>
    <a class="nav-item" routerLink="/profile" routerLinkActive="nav-item--active">
      <span class="nav-icon nav-icon--profile">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" /></svg>
      </span>
      <span class="nav-label">Profile</span>
    </a>
  </nav>
  }
</div>
