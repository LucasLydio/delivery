<dialog
  #dialog
  class="confirm-dialog"
  aria-labelledby="confirm-dialog-title"
  aria-describedby="confirm-dialog-description"
  (cancel)="cancel($event)"
  (close)="handleNativeClose()"
  (click)="handleBackdropClick($event)"
>
  <section class="confirm-dialog__panel">
    <h2 id="confirm-dialog-title">{{ options().title }}</h2>
    <p id="confirm-dialog-description">{{ options().message }}</p>

    <footer class="confirm-dialog__actions">
      <button #cancelButton type="button" class="secondary" (click)="cancel()">
        {{ options().cancelLabel }}
      </button>
      <button type="button" [class.danger]="options().destructive" (click)="confirm()">
        {{ options().confirmLabel }}
      </button>
    </footer>
  </section>
</dialog>
